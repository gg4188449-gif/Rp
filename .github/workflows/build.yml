name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Find project (unzip if it was uploaded as a .zip)
        run: |
          if [ -z "$(find . -name gradlew -not -path './.git/*' | head -1)" ]; then
            zip=$(find . -maxdepth 2 -name '*.zip' -not -path './.git/*' | head -1)
            if [ -n "$zip" ]; then
              echo "Unzipping $zip"
              unzip -q -o "$zip" -d _project
            fi
          fi
          gradlew=$(find . -name gradlew -not -path './.git/*' | head -1)
          if [ -z "$gradlew" ]; then
            echo "::error::gradlew not found in the repository. Files at the repo root:"
            ls -la
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$gradlew")" >> "$GITHUB_ENV"
          echo "Project directory: $(dirname "$gradlew")"

      - name: Install SDK, NDK and CMake
        run: |
          export JAVA_HOME="${JAVA_HOME_21_X64:-$JAVA_HOME}"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "ndk;26.2.11394342" "cmake;3.22.1"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/out/"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk

      - name: Upload build reports (only if build failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/app/build/reports
          if-no-files-found: ignore
